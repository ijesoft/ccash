services:
  postgres:
    image: postgres:17-alpine
    container_name: ccash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccash
      POSTGRES_PASSWORD: ccash_secret_2024
      POSTGRES_DB: ccash
    volumes:
      - ccash-postgres-data:/var/lib/postgresql/data
    networks:
      - ccash-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccash"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ccash-redis
    restart: unless-stopped
    networks:
      - ccash-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ccash-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ccash
      RABBITMQ_DEFAULT_PASS: ccash_secret_2024
    networks:
      - ccash-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ccash-net:
    driver: bridge

volumes:
  ccash-postgres-data:
