services:
  postgres:
    image: postgres:17-alpine
    container_name: ccash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccash
      POSTGRES_PASSWORD: ccash_secret_2024
      POSTGRES_DB: ccash
    volumes:
      - ccash-postgres-data:/var/lib/postgresql/data
    networks:
      ccash-net:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccash"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ccash-redis
    restart: unless-stopped
    networks:
      ccash-net:
        ipv4_address: 172.28.0.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ccash-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ccash
      RABBITMQ_DEFAULT_PASS: ccash_secret_2024
    networks:
      ccash-net:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Captures every outgoing email so registration/login OTPs are viewable
  # without a real SMTP provider. SMTP on 1025, web UI on 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ccash-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      ccash-net:
        ipv4_address: 172.28.0.5
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Addresses are pinned because backend/.env reaches these services by IP.
  # Without a declared subnet, Docker reassigns addresses on recreate and the
  # backend silently loses its database.
  ccash-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  ccash-postgres-data:
