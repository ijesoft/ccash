name: ccash

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  uploads:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: ccash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccash_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-ccash}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccash"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ccash-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ccash-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ccash}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ccash_secret_2024}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccash-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ccash}:${POSTGRES_PASSWORD:-ccash_secret_2024}@postgres:5432/${POSTGRES_DB:-ccash}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-ccash}:${RABBITMQ_PASSWORD:-ccash_secret_2024}@rabbitmq:5672/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_net
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccash-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ccash}:${POSTGRES_PASSWORD:-ccash_secret_2024}@postgres:5432/${POSTGRES_DB:-ccash}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-ccash}:${RABBITMQ_PASSWORD:-ccash_secret_2024}@rabbitmq:5672/
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccash-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-ccash}:${RABBITMQ_PASSWORD:-ccash_secret_2024}@rabbitmq:5672/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccash-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost/api
      - VITE_WS_URL=ws://localhost/ws
    depends_on:
      - backend
    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: ccash-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net
      - backend_net
      - monitoring_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ccash-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ccash.ph}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - backend_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: ccash-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - backend_net

  prometheus:
    image: prom/prometheus:latest
    container_name: ccash-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: ccash-grafana
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - GF_SERVER_HTTP_PORT=3001
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_net

  loki:
    image: grafana/loki:latest
    container_name: ccash-loki
    restart: unless-stopped
    user: root
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:latest
    container_name: ccash-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring_net